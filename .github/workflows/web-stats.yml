name: RuyiSDK Stats Collect & Archive

on:
  schedule:
    - cron: '22 0 * * 2'      # 每周二 UTC 00:22 = 北京 08:22 → 周度
    - cron: '22 0 1 * *'      # 每月 1 日 UTC 00:22 = 北京 08:22 → 月度（归结上月）
  workflow_dispatch:
    inputs:
      period:
        description: 'auto=按触发日判定(周二=weekly,1日=monthly);非采集日手动采集请显式选择'
        type: choice
        options: [auto, weekly, monthly, both]
        default: auto

permissions:
  contents: write

concurrency:
  group: web-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine periods
        id: periods
        run: |
          set -e
          IN="${{ github.event.inputs.period }}"
          DOW=$(TZ=Asia/Shanghai date +%u)       # 1=Mon ... 7=Sun
          DOM=$(TZ=Asia/Shanghai date +%d)
          case "$IN" in
            weekly)  P="weekly";;
            monthly) P="monthly";;
            both)    P="weekly monthly";;
            auto)
              P=""
              [ "$DOW" = "2" ]  && P="weekly"
              [ "$DOM" = "01" ] && P="${P:+$P }monthly"
              ;;
          esac
          if [ -z "$P" ]; then
            echo "::notice::非采集日且 period=auto，本次不采集（手动采集请显式选 weekly/monthly/both）"
            P="none"
          fi
          echo "periods=$P" >> "$GITHUB_OUTPUT"
          echo "[periods] $P"

      # ==== 1. CF 采集（最高优先级; 含 JSON 归档 + csv 登记含 TOTAL 维护, 一步闭环） ====
      # cf_stats.py 接口: --period {weekly,monthly} 必填
      # 缺省窗口: weekly=上个周二~本周二; monthly=上月1日~本月1日
      - name: Run Cloudflare stats
        if: steps.periods.outputs.periods != 'none'
        working-directory: cf-stats
        env:
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          for PERIOD in ${{ steps.periods.outputs.periods }}; do
            echo "[cf-stats] $PERIOD (脚本默认窗口)"
            python cf_stats.py --period "$PERIOD"
          done

      # ==== 2. web-stats 采集（可能失败, 不影响上面已产出） ====

      - name: Setup Node.js
        if: steps.periods.outputs.periods != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        if: steps.periods.outputs.periods != 'none'
        working-directory: web-stats
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create ~/.netrc for ES auth
        if: steps.periods.outputs.periods != 'none'
        run: |
          cat > ~/.netrc <<'NETRC_EOF'
          ${{ secrets.ES_NETRC }}
          NETRC_EOF
          chmod 600 ~/.netrc

      - name: Run screenshot script
        if: steps.periods.outputs.periods != 'none'
        working-directory: web-stats
        run: node screenshot.mjs
        env:
          VSM_COOKIE: ${{ secrets.VSM_COOKIE }}

      - name: Get result directories
        if: steps.periods.outputs.periods != 'none'
        id: dirs
        run: |
          set -e
          DIRS=$(tr '\n' ' ' < web-stats/result_dir.txt | xargs)
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "归档目录: $DIRS"

      - name: Run statistics script
        if: steps.periods.outputs.periods != 'none'
        run: |
          set -e
          for d in ${{ steps.dirs.outputs.dirs }}; do
            echo "[stats] $d"
            RESULT_DIR="$d" bash web-stats/ruyisdk_stats.sh
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}

      - name: Update dashboard CSVs
        if: steps.periods.outputs.periods != 'none'
        run: |
          set -e
          for P in ${{ steps.periods.outputs.periods }}; do
            echo "[csv] $P"
            python web-stats/update_dashboard_csv.py --period "$P"
          done

      # ==== 3. commit（数据落库, 关键步骤; if: always() 保证部分成功也入库） ====

      - name: Commit and push results
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf-stats web-stats
          if git diff --staged --quiet; then
            echo "No changes to commit"; exit 0
          fi
          git commit -m "📊 自动采集(${{ steps.periods.outputs.periods }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${{ github.ref_name }}

      # ==== 4. AI 通知（锦上添花, 失败不影响已归档数据） ====

      - name: AI summary & Feishu notify
        if: always() && steps.periods.outputs.periods != 'none'
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL:    ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
        run: |
          set -e
          python web-stats/ai_summary.py --send
