name: RuyiSDK Stats Collect & Archive

on:
  schedule:
    - cron: '22 0 * * 2'      # 每周二 UTC 00:22 = 北京 08:22 → 周度
    - cron: '22 0 1 * *'      # 每月 1 日 UTC 00:22 = 北京 08:22 → 月度（归结上月）
  workflow_dispatch:
    inputs:
      period:
        description: 'dashboard 统计周期: auto=按本次归档目录判定'
        type: choice
        options: [auto, weekly, monthly, both]
        default: auto
      cf_start_date:
        description: '[仅cf-stats补采] 起始 YYYYMMDD(北京时间)。填写后本workflow只做校验并转发到专用cf-stats workflow'
        required: false
        default: ''
      cf_end_date:
        description: '[仅cf-stats补采] 结束 YYYYMMDD，与起始日期必须同时填写'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: web-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate cf backfill inputs
        id: cf_backfill
        run: |
          S="${{ github.event.inputs.cf_start_date }}"
          E="${{ github.event.inputs.cf_end_date }}"
          if { [ -n "$S" ] && [ -z "$E" ] || [ -z "$S" ] && [ -n "$E" ]; }; then
            echo "::error::cf_start_date 与 cf_end_date 必须同时填写"; exit 1
          fi
          if [ -n "$S" ]; then
            if ! [[ "$S" =~ ^[0-9]{8}$ && "$E" =~ ^[0-9]{8}$ ]]; then
              echo "::error::日期格式必须为 YYYYMMDD，收到: S=$S E=$E"; exit 1
            fi
            if [ "$S" -ge "$E" ]; then
              echo "::error::start($S) 必须早于 end($E)"; exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "start=$S" >> "$GITHUB_OUTPUT"
            echo "end=$E" >> "$GITHUB_OUTPUT"
            echo "本次为 cf-stats 专用补采: $S ~ $E（转发到专用 workflow，本 run 跳过截图/json/csv）"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- cf-stats 补采：转发到独立 workflow "RuyiSDK Cloudflare Web Stats" ----
      # 该 workflow 自带窗口解析/校验/归档/commit，本 workflow 不再直接调用 cf_stats.py

      - name: Trigger cf-stats backfill
        if: steps.cf_backfill.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # 需具备 contents + workflow 权限
          BF_S: ${{ steps.cf_backfill.outputs.start }}
          BF_E: ${{ steps.cf_backfill.outputs.end }}
        run: |
          set -e
          if [ "${BF_S:4:2}" = "01" ] && [ "${BF_S:6:2}" = "01" ]; then P=monthly; else P=weekly; fi
          echo "[forward] 转发 cf-stats 补采: period=$P window=$BF_S~$BF_E"
          gh workflow run "RuyiSDK Cloudflare Web Stats" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f period="$P" -f start_date="$BF_S" -f end_date="$BF_E"
          echo "已触发，请在 Actions 页查看 'RuyiSDK Cloudflare Web Stats' 的新 run"

      # ---- 以下截图/json/csv 步骤在 cf-stats 专用补采时全部跳过 ----

      - name: Install Playwright
        if: steps.cf_backfill.outputs.enabled == 'false'
        working-directory: web-stats
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create ~/.netrc for ES auth
        if: steps.cf_backfill.outputs.enabled == 'false'
        run: |
          cat > ~/.netrc <<'NETRC_EOF'
          ${{ secrets.ES_NETRC }}
          NETRC_EOF
          chmod 600 ~/.netrc

      - name: Run screenshot script
        if: steps.cf_backfill.outputs.enabled == 'false'
        working-directory: web-stats
        run: node screenshot.mjs
        env:
          VSM_COOKIE: ${{ secrets.VSM_COOKIE }}

      - name: Get result directories
        if: steps.cf_backfill.outputs.enabled == 'false'
        id: dirs
        run: |
          set -e
          DIRS=$(tr '\n' ' ' < web-stats/result_dir.txt | xargs)
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "归档目录: $DIRS"

      - name: Determine periods
        if: steps.cf_backfill.outputs.enabled == 'false'
        id: periods
        run: |
          set -e
          PERIODS=""
          if echo "${{ steps.dirs.outputs.dirs }}" | grep -q "results-weekly";  then PERIODS="weekly";  fi
          if echo "${{ steps.dirs.outputs.dirs }}" | grep -q "results-monthly"; then PERIODS="${PERIODS:+$PERIODS }monthly"; fi
          case "${{ github.event.inputs.period }}" in
            weekly)  PERIODS="weekly";;
            monthly) PERIODS="monthly";;
            both)    PERIODS="weekly monthly";;
          esac
          [ -z "$PERIODS" ] && PERIODS="none"
          echo "periods=$PERIODS" >> "$GITHUB_OUTPUT"

      - name: Run statistics script
        if: steps.cf_backfill.outputs.enabled == 'false' && steps.periods.outputs.periods != 'none'
        run: |
          set -e
          for d in ${{ steps.dirs.outputs.dirs }}; do
            echo "[stats] $d"
            RESULT_DIR="$d" bash web-stats/ruyisdk_stats.sh
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}

      - name: Update dashboard CSVs
        if: steps.cf_backfill.outputs.enabled == 'false' && steps.periods.outputs.periods != 'none'
        run: |
          set -e
          for P in ${{ steps.periods.outputs.periods }}; do
            echo "[csv] $P"
            python web-stats/update_dashboard_csv.py --period "$P"
          done

      # ---- AI 巡检 → 飞书（仅常规采集；cf 专用补采时跳过） ----

      - name: AI summary & Feishu notify
        if: steps.cf_backfill.outputs.enabled == 'false'
        env:
          FEISHU_WEBHOOK_URL:    ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
        run: |
          set -e
          python web-stats/ai_summary.py --send

      - name: Commit and push results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BF:   ${{ steps.cf_backfill.outputs.enabled }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ "$BF" = "true" ]; then
            echo "cf-stats 专用补采：归档由 'RuyiSDK Cloudflare Web Stats' 自行 commit，本 run 跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "📊 自动采集(${{ steps.periods.outputs.periods }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
