name: Cloudflare GraphQL Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Secret 体检
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          t = os.environ["CF_TOKEN"]
          print(f"Secret 长度: {len(t)}")
          bad = [(i, hex(ord(c))) for i, c in enumerate(t) if not 32 < ord(c) < 127]
          print("非法字符:", bad if bad else "无")
          print("包含空格:", " " in t, "| 包含换行:", "\n" in t)
          EOF

      - name: Verify token
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -m json.tool

      - name: List accessible accounts（匹配账户级 token，替代 zones）
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if not d.get('success'):
              print('::error::查询 accounts 失败:', d.get('errors')); sys.exit(1)
          for a in d['result']:
              print(f\"account: {a['name']:40s} id: {a['id']}\")
          "

      - name: 账户级 GraphQL 最小查询（真正验证你的脚本链路）
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, urllib.request, os

          token = os.environ["CF_TOKEN"].replace("\ufeff", "").strip()

          def gql(query, variables=None):
              body = json.dumps({"query": query, "variables": variables or {}}).encode()
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4/graphql",
                  data=body,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          # 1. 先拿到 accountTag
          res = gql('''query { viewer { accounts { accountTag } } }''')
          print("=== 账户列表 ===")
          print(json.dumps(res, indent=2, ensure_ascii=False))
          if res.get("errors"):
              print("::error::GraphQL 报错:", res["errors"]); exit(1)

          accounts = res["data"]["viewer"]["accounts"]
          if not accounts:
              print("::error::token 看不到任何账户，检查 Account Analytics Read 权限和账户资源范围"); exit(1)

          tag = accounts[0]["accountTag"]

          # 2. 用你的脚本同样的账户级数据集做最小查询
          q = '''query($accountTag: string) {
            viewer { accounts(filter: { accountTag: $accountTag }) {
              httpRequestsAdaptiveGroups(limit: 5,
                filter: { datetime_geq: "2026-09-15T00:00:00Z",
                          datetime_lt:  "2026-09-22T00:00:00Z" }) {
                sum { requests }
                dimensions { clientCountryName }
              } } } }'''
          res = gql(q, {"accountTag": tag})
          print("=== httpRequestsAdaptiveGroups 最小查询 ===")
          print(json.dumps(res, indent=2, ensure_ascii=False))
          if res.get("errors"):
              print("::error::GraphQL 报错:", res["errors"])
          else:
              print("✅ 账户级 GraphQL 链路完全正常，cf_stats.py 用的就是这条路径")

          # 3. Introspection：列出全部合法维度
          res = gql('''query { __type(name: "HttpRequestsAdaptiveGroupsDimensions") {
              fields { name } } }''')
          print("=== 合法 dimensions 字段 ===")
          for f in (res["data"]["__type"] or {}).get("fields", []):
              print(f"  {f['name']}")
          EOF
