name: RuyiSDK Cloudflare Web Stats

on:
  schedule:
    # 每周二 UTC 01:00 = 北京时间周二 09:00
    # 窗口 = 上周二 00:00:00 ~ 当天 00:00:00 (GMT+8)
    - cron: '0 1 * * 2'
    # 每月 1 日 UTC 01:00 = 北京时间 1 日 09:00
    # 窗口 = 上月 1 日 00:00:00 ~ 本月 1 日 00:00:00 (GMT+8)
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      period:
        description: '统计周期'
        type: choice
        options: [weekly, monthly]
        default: weekly
        required: true
      start_date:
        description: '起始日期 YYYYMMDD（北京时间，含当天 00:00）。留空=按周期规则自动计算'
        required: false
        default: ''
      end_date:
        description: '结束日期 YYYYMMDD（北京时间，含当天 00:00）。留空=按周期规则自动计算'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cf-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve window
        id: win
        run: |
          set -e
          PERIOD_IN="${{ github.event.inputs.period }}"
          START_IN="${{ github.event.inputs.start_date }}"
          END_IN="${{ github.event.inputs.end_date }}"

          # ---------- 判定周期 ----------
          # 手动触发: 用选择的 period; 定时触发: 按北京时间"星期/几号"判定
          if [ -n "$PERIOD_IN" ]; then
            PERIOD="$PERIOD_IN"
          else
            DOW=$(TZ=Asia/Shanghai date +%u)          # 1=Mon ... 7=Sun
            DOM=$(TZ=Asia/Shanghai date +%d)
            if [ "$DOW" = "2" ]; then PERIOD=weekly
            elif [ "$DOM" = "01" ]; then PERIOD=monthly
            else echo "非计划采集日，跳过"; exit 0; fi
          fi

          # ---------- monthly: 窗口固定, 不接受任何日期输入 ----------
          if [ "$PERIOD" = "monthly" ]; then
            if [ -n "$START_IN" ] || [ -n "$END_IN" ]; then
              echo "::error::月统计窗口固定为 上月1日~本月1日，不接受起止日期输入"; exit 1
            fi
            START=$(TZ=Asia/Shanghai date +%Y%m01)
            END=$(TZ=Asia/Shanghai date -d "+1 month" +%Y%m01)
            # 特例: 1日定时运行时"今天"就是本月1日 → 上月1日~本月1日, 正确

          # ---------- weekly: 按你定义的三种情况 ----------
          else
            if [ -n "$START_IN" ] && [ -n "$END_IN" ]; then
              # 都不为空: 按实际日期
              START="$START_IN"; END="$END_IN"
            elif [ -z "$START_IN" ] && [ -z "$END_IN" ]; then
              # 都为空: 上周二 ~ 本周二 (定时与手动口径一致)
              DOW=$(TZ=Asia/Shanghai date +%u)
              OFFSET=$(( (DOW - 2 + 7) % 7 ))
              END=$(TZ=Asia/Shanghai date -d "-$OFFSET day" +%Y%m%d)
              START=$(TZ=Asia/Shanghai date -d "@$(( $(date -d "${END:0:4}-${END:4:2}-${END:6:2}" +%s) - 7*86400 ))" +%Y%m%d)
            else
              # 只填一个: 明确拒绝
              echo "::error::START_DATE 与 END_DATE 必须同时填写或同时留空（特殊窗口请两个都填）"; exit 1
            fi
          fi

          # ---------- 统一校验 ----------
          if ! [[ "$START" =~ ^[0-9]{8}$ && "$END" =~ ^[0-9]{8}$ ]]; then
            echo "::error::日期格式必须为 YYYYMMDD，收到: START=$START END=$END"; exit 1
          fi
          if [ "$START" -ge "$END" ]; then
            echo "::error::START($START) 必须早于 END($END)"; exit 1
          fi
          if [ $(( ( $(date -d "${END:0:4}-${END:4:2}-${END:6:2}" +%s) \
                    - $(date -d "${START:0:4}-${START:4:2}-${START:6:2}" +%s) ) / 86400 )) -gt 92 ]; then
            echo "::error::窗口跨度超过 92 天，请检查日期"; exit 1
          fi

          echo "period=$PERIOD" >> "$GITHUB_OUTPUT"
          echo "start=$START"   >> "$GITHUB_OUTPUT"
          echo "end=$END"       >> "$GITHUB_OUTPUT"
          echo "[window] $PERIOD: $START 00:00 ~ $END 00:00 (GMT+8)"


      - name: Run Cloudflare stats
        working-directory: cf-stats
        env:
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PERIOD:        ${{ steps.win.outputs.period }}
          START_DATE:    ${{ steps.win.outputs.start }}
          END_DATE:      ${{ steps.win.outputs.end }}
        run: |
          set -e
          echo "[run] period=$PERIOD window=$START_DATE~$END_DATE"
          python cf_stats.py --period "$PERIOD"

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cf-stats
          git diff --cached --quiet || git commit -m "chore(cf-stats): update $(TZ=Asia/Shanghai date +%Y%m%d) [skip ci]"
          git push
